    <script>
      if ('serviceWorker' in navigator && window.location.hostname !== 'localhost' && window.location.hostname !== '127.0.0.1') {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js').then(reg => {
            // Força verificação imediata de update a cada carregamento
            reg.update();

            // Quando novo SW instala e ativa, recarrega automaticamente
            reg.addEventListener('updatefound', () => {
              const newWorker = reg.installing;
              if (!newWorker) return;
              newWorker.addEventListener('statechange', () => {
                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                  // Novo SW instalado e aguardando — recarrega para aplicar
                  window.location.reload();
                }
              });
            });
          }).catch(err => {
            console.warn('SW registration failed:', err);
          });

          // Quando o SW muda de controller (após skipWaiting), recarrega
          navigator.serviceWorker.addEventListener('controllerchange', () => {
            window.location.reload();
          });
        });
      }

      // Captura do prompt de instalação o mais cedo possível
      window.deferredPrompt = null;
      window.addEventListener('beforeinstallprompt', (e) => {
        console.log('PWA: Evento de instalação capturado');
        e.preventDefault();
        window.deferredPrompt = e;
        // Notifica o React se ele já estiver pronto
        window.dispatchEvent(new CustomEvent('pwa-prompt-ready', { detail: e }));
      });
